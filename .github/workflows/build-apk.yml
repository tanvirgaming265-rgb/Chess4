name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          
          echo "Java version verification passed ($JAVA_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists, skipping creation."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore confirmed."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at $EXPECTED_APK"
            echo "Listing files inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file at $EXPECTED_APK is empty."
            exit 1
          fi

          echo "Debug APK successfully verified at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep-asset
        run: |
          TMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TMP_DIR"
          
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          fi
          
          # Sanitize repository name to safe characters
          REPO_SAFE=$(echo "$REPO_RAW" | tr -c 'a-zA-Z0-9_-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="android-app"
          fi
          
          RELEASE_FILENAME="${REPO_SAFE}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TMP_DIR}/${RELEASE_FILENAME}"
          
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $DEST_PATH"
          echo "filename=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "path=${DEST_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prep-asset.outputs.path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset invalid or missing at $ASSET_PATH"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build
          
          - **Run Number**: #${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Built By**: GitHub Actions
          
          > **Note**: This is an automatically generated debug APK intended solely for testing and evaluation. It is signed using a temporary debug keystore and is not intended for Google Play production deployment.
          EOF
          )
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prep-asset.outputs.filename }}"
          
          if [ "${{ steps.create-release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            RELEASE_URL=""
            if command -v gh >/dev/null 2>&1; then
              gh release view "$RELEASE_TAG" || true
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            else
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            fi
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Direct Download**: [View Release & Download APK]($RELEASE_URL)"
              echo "- **APK Asset Filename**: \`$ASSET_NAME\`"
              echo ""
              echo "📱 You can download and install the APK directly on your phone from the release **Assets** section."
              echo "📦 The normal GitHub Actions artifact (\`app-debug-apk\`) is also preserved as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The APK was successfully built and is available via GitHub Actions artifact: app-debug-apk."
            
            {
              echo "### ⚠️ APK Built Successfully (Release Publishing Warning)"
              echo ""
              echo "- The debug APK was compiled and verified successfully."
              echo "- **Backup Artifact**: Download \`app-debug-apk\` directly from the GitHub Actions workflow run artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
